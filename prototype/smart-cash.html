<title>Smart Cash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap">
<style>
/* Layout: phone prototype (HarmonyOS-style glass widgets on a soft wallpaper) beside a control panel.
   Palette: Uber-like monochrome, one blue for action; green/amber/red only for status. */
:root{
  --bg:#FFFFFF; --bg2:#F1F2F5; --fg:#000000; --muted:#545454; --subtle:#6B6B6B; --t3:#B5B5B5;
  --surface:#EEEFF2; --track:#E2E3E7; --line:rgba(0,0,0,.07);
  --glass:rgba(255,255,255,.74); --glass-line:rgba(255,255,255,.85); --glass-shadow:0 8px 28px rgba(20,30,60,.08);
  --wall-a:rgba(39,110,241,.20); --wall-b:rgba(39,110,241,.07); --wall-c:rgba(0,0,0,.04);
  --primary:#000000; --on-primary:#FFFFFF; --accent:#276EF1; --on-accent:#FFFFFF; --accent-soft:rgba(39,110,241,.12);
  --pos:#06C167; --pos-text:#05944F; --pos-soft:rgba(6,193,103,.13);
  --warn:#FFC043; --warn-text:#8A6100; --warn-soft:rgba(255,192,67,.22);
  --neg:#E11900; --neg-soft:rgba(225,25,0,.10);
  --card:#000000; --on-card:#FFFFFF; --card-muted:#AFAFAF; --card-track:#333333;
  --stage:#E9EBEF; --bezel:#0A0A0A; --paper:#FFFFFF; --ink:#1A1A1A;
  --font-latin:"Figtree","Helvetica Neue",Arial,sans-serif; --font:var(--font-latin);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --bg2:#000000; --fg:#FFFFFF; --muted:#AFAFAF; --subtle:#8E8E8E; --t3:#4A4A4A;
  --surface:#1C1C1E; --track:#2C2C2E; --line:rgba(255,255,255,.07);
  --glass:rgba(28,28,30,.70); --glass-line:rgba(255,255,255,.07); --glass-shadow:0 8px 28px rgba(0,0,0,.4);
  --wall-a:rgba(39,110,241,.34); --wall-b:rgba(39,110,241,.12); --wall-c:rgba(255,255,255,.03);
  --primary:#FFFFFF; --on-primary:#000000; --accent:#276EF1; --on-accent:#FFFFFF; --accent-soft:rgba(39,110,241,.22);
  --pos:#06C167; --pos-text:#06C167; --pos-soft:rgba(6,193,103,.16);
  --warn:#FFC043; --warn-text:#FFC043; --warn-soft:rgba(255,192,67,.15);
  --neg:#F25138; --neg-soft:rgba(242,81,56,.16);
  --card:#1C1C1E; --on-card:#FFFFFF; --card-muted:#AFAFAF; --card-track:#3A3A3C;
  --stage:#0B0B0C; --bezel:#2B2B2D; --paper:#F2F2F2; --ink:#1A1A1A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#000000; --fg:#FFFFFF; --muted:#AFAFAF; --subtle:#8E8E8E; --t3:#4A4A4A;
  --surface:#1C1C1E; --track:#2C2C2E; --line:rgba(255,255,255,.07);
  --glass:rgba(28,28,30,.70); --glass-line:rgba(255,255,255,.07); --glass-shadow:0 8px 28px rgba(0,0,0,.4);
  --wall-a:rgba(39,110,241,.34); --wall-b:rgba(39,110,241,.12); --wall-c:rgba(255,255,255,.03);
  --primary:#FFFFFF; --on-primary:#000000; --accent:#276EF1; --on-accent:#FFFFFF; --accent-soft:rgba(39,110,241,.22);
  --pos:#06C167; --pos-text:#06C167; --pos-soft:rgba(6,193,103,.16);
  --warn:#FFC043; --warn-text:#FFC043; --warn-soft:rgba(255,192,67,.15);
  --neg:#F25138; --neg-soft:rgba(242,81,56,.16);
  --card:#1C1C1E; --on-card:#FFFFFF; --card-muted:#AFAFAF; --card-track:#3A3A3C;
  --stage:#0B0B0C; --bezel:#2B2B2D; --paper:#F2F2F2; --ink:#1A1A1A; color-scheme:dark }
html[lang="ar"]{--font:"IBM Plex Sans Arabic",var(--font-latin)}
html[lang="ur"],html[lang="fa"]{--font:"Noto Sans Arabic",var(--font-latin)}
html[lang="hi"],html[lang="ne"]{--font:"Noto Sans Devanagari",var(--font-latin)}
html[lang="bn"]{--font:"Noto Sans Bengali",var(--font-latin)}
html[lang="ml"]{--font:"Noto Sans Malayalam",var(--font-latin)}

html,body{height:100%}
body{background:var(--stage); color:var(--fg); font-family:var(--font); -webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer; padding:0; text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:10px}
.num{font-family:var(--font-latin); font-variant-numeric:tabular-nums}
bdi{unicode-bidi:isolate}
[dir="rtl"] .flip{transform:scaleX(-1)}
.rot90{transform:rotate(90deg)}
.pos{color:var(--pos-text)} .neg{color:var(--neg)} .t3{color:var(--t3)} .small{font-size:12px}
.hero + .ctx,.hero + .banner{margin-top:12px}
.t1.sel{white-space:normal; overflow-wrap:anywhere}
.login-top .brand{white-space:nowrap}
.center-t{text-align:center; display:block; width:100%}

/* ---------- stage & panel ---------- */
.stage{min-height:100%; display:grid; grid-template-columns:minmax(0,320px) auto; gap:56px; justify-content:center; align-items:center;
  padding-block:28px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.panel{display:flex; flex-direction:column; gap:20px; min-width:0}
#pn-top{display:flex; flex-direction:column; gap:10px}
#pn-ctrl{display:flex; flex-direction:column; gap:18px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:21px; letter-spacing:-.02em}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--primary); color:var(--on-primary); display:grid; place-items:center}
.panel p{margin:0; color:var(--muted); line-height:1.6; max-width:38ch; font-size:14px}
.panel-fig{width:100%; max-width:280px; --hairline-plate:var(--stage)}
.plabel{font-size:12px; font-weight:600; color:var(--subtle); letter-spacing:.04em; margin-bottom:8px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{padding:7px 12px; border-radius:999px; background:var(--surface); font-size:13px; font-weight:600}
.chip[aria-pressed="true"]{background:var(--primary); color:var(--on-primary)}
.pn-users{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.pn-u{display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:12px; background:var(--surface); font-size:12px; font-weight:600; min-width:0}
.pn-u span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pn-u .t2{margin-inline-start:auto; font-weight:500}
.pn-u.on{outline:1.5px solid var(--fg)}
.pn-row{display:flex; gap:6px; flex-wrap:wrap}

/* ---------- phone ---------- */
.phone{width:392px; max-width:100%; height:830px; border:11px solid var(--bezel); border-radius:54px; position:relative; overflow:hidden; display:flex; flex-direction:column;
  background:radial-gradient(130% 55% at 0% 0%, var(--wall-a), transparent 62%), radial-gradient(90% 45% at 100% 22%, var(--wall-b), transparent 60%), radial-gradient(120% 50% at 50% 110%, var(--wall-c), transparent 70%), var(--bg2);
  box-shadow:0 30px 80px rgba(0,0,0,.20)}
.phone.dark-screen{background:#070707; color:#fff}
.statusbar{height:42px; flex:none; display:flex; align-items:center; justify-content:space-between; padding-inline:28px; font:600 15px var(--font-latin); direction:ltr}
.statusbar.on-dark{color:#fff}
.view{flex:1; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; scrollbar-width:none; position:relative}
.view::-webkit-scrollbar{display:none}
.view > *{flex-shrink:0}
.page{display:flex; flex-direction:column; min-height:100%}
.page.center{justify-content:center; align-items:center; gap:14px; padding:24px; text-align:center}
.spacer{height:110px}
.pad-x{padding-inline:18px}
.stack{display:flex; flex-direction:column; gap:8px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* glass */
.glass{background:var(--glass); -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%); border:1px solid var(--glass-line); box-shadow:var(--glass-shadow)}
.card{margin:12px 16px 0; border-radius:var(--r-lg); padding:16px}

/* type */
.h1{font-size:27px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0; text-wrap:balance}
.h2{font-size:17px; font-weight:700; margin:0}
.sub{color:var(--muted); font-size:14px; line-height:1.5}
.lead{font-size:15px; margin:6px 0 0}
.t1{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.t2{color:var(--muted); font-size:12.5px; margin-top:2px}
.ctx{margin:0 18px 6px; font-size:13px; color:var(--muted)}
.sec-h{display:flex; justify-content:space-between; align-items:baseline; margin:22px 20px 10px}
.sec-t{font-weight:700; font-size:15px}
.link{color:var(--accent); font-weight:600; font-size:14px}

/* nav */
.nav{display:flex; align-items:center; gap:10px; padding:6px 16px 10px; min-height:52px}
.nav-t{font-size:22px; font-weight:800; letter-spacing:-.02em; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-r{display:flex; gap:8px}
.iconbtn{width:40px; height:40px; border-radius:50%; background:var(--glass); display:grid; place-items:center; position:relative; flex:none}
.iconbtn .dot{position:absolute; top:9px; inset-inline-end:10px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--bg)}

/* buttons */
.btn{height:50px; border-radius:var(--r-md); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding-inline:14px}
.btn.auto{width:auto; padding-inline:20px}
.btn-sm{height:34px; border-radius:999px; font-size:13px; width:auto; padding-inline:14px}
.btn-primary{background:var(--primary); color:var(--on-primary)}
.btn-accent{background:var(--accent); color:var(--on-accent)}
.btn-glass{background:var(--glass); border:1px solid var(--glass-line)}
.btn-neg{background:var(--neg-soft); color:var(--neg)}
.btn-neg-solid{background:var(--neg); color:#fff}
.btn-gave{background:var(--neg); color:#fff} .btn-got{background:var(--pos-text); color:#fff}
.btn:disabled{opacity:.45}

/* lang dropdown */
.langsel{display:inline-flex; align-items:center; gap:6px; height:36px; padding-inline:12px 10px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line); position:relative; font-size:13px; font-weight:600; flex:none}
.langsel select{appearance:none; -webkit-appearance:none; background:transparent; border:0; font-weight:600; font-size:13px; padding:0; max-width:130px; cursor:pointer}
.langsel select:focus{outline:none}
.langsel:focus-within{outline:2px solid var(--accent); outline-offset:2px}
.panel .langsel{background:var(--surface); border-color:transparent}

/* ---------- login ---------- */
.login{display:flex; flex-direction:column; gap:14px; padding:4px 18px 30px}
.login-top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.lang-bubbles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:14px 4px 4px}
.lb{padding:9px 14px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line); box-shadow:var(--glass-shadow); font-size:14px; font-weight:600;
  animation:float 6s ease-in-out infinite; animation-delay:calc(var(--i) * -.5s)}
.lb.on{background:var(--primary); color:var(--on-primary); border-color:transparent}
@keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
.login .h1{font-size:30px; margin-top:6px}
.form{display:flex; flex-direction:column; gap:12px}
.login .card{margin:6px 0 0}
.fld{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--muted); min-width:0}
.fld input,.fld select,textarea{height:46px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--bg); color:var(--fg); padding-inline:12px; font-size:15px; font-weight:500; width:100%; min-width:0}
.fld select{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--subtle) 50%),linear-gradient(135deg,var(--subtle) 50%,transparent 50%); background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat}
[dir="rtl"] .fld select{background-position:18px 50%, 13px 50%}
.fld.low input{background:var(--warn-soft); border-color:var(--warn)}
textarea{min-height:88px; padding:12px; resize:none; height:auto}
.or{display:flex; align-items:center; gap:10px; color:var(--subtle); font-size:12px}
.or::before,.or::after{content:""; height:1px; flex:1; background:var(--line)}
.err{color:var(--neg); font-size:13px; font-weight:600}
.kbd{background:var(--surface); padding:1px 6px; border-radius:6px; font-weight:700; color:var(--fg)}
.demo{display:flex; flex-direction:column; gap:6px; margin-top:6px}
.demo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px}
.demo-u{border-radius:var(--r-md); padding:10px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; min-width:0}
.du-r{font-size:11px; font-weight:700; line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.du-n{font-size:10.5px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* avatars by role */
.avatar{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-weight:800; flex:none; background:var(--surface); color:var(--fg); font-size:16px}
.avatar.sm{width:36px; height:36px; font-size:14px} .avatar.xs{width:24px; height:24px; font-size:11px} .avatar.lg{width:58px; height:58px; font-size:22px}
.avatar.r-finance,.avatar.r-admin{background:var(--primary); color:var(--on-primary)}
.avatar.r-pm,.avatar.r-procurement{background:var(--accent); color:#fff}
.avatar.r-accountant{background:var(--pos-soft); color:var(--pos-text)}
.avatar.r-engineer,.avatar.r-supervisor{background:var(--accent-soft); color:var(--accent)}

/* ---------- home ---------- */
.hh{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:4px 16px 0}
.hh-date{font-size:13px; color:var(--muted); font-weight:600}
.hh .h1{font-size:25px; margin-top:2px}
.hh-r{display:flex; align-items:center; gap:6px}
.hh-r .langsel{max-width:96px; padding-inline:10px 8px} .hh-r .langsel select{max-width:54px}
.me-bubble{border-radius:50%; padding:2px; background:conic-gradient(var(--accent), var(--primary), var(--accent))}
.me-bubble .avatar{border:2px solid var(--bg)}
.role-chip{margin:8px 16px 0; display:inline-flex; align-self:flex-start; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line); font-size:12px; font-weight:600; color:var(--muted)}
.wgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 16px 0}
.w{border-radius:var(--r-lg); padding:14px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:start; min-height:118px; position:relative; min-width:0}
.w.static{cursor:default}
.w-wide{margin:12px 16px 0; min-height:0}
.w-dark{background:var(--card); color:var(--on-card); box-shadow:var(--glass-shadow)}
.w-accent{background:var(--accent); color:#fff; box-shadow:0 10px 30px rgba(39,110,241,.35)}
.w-accent .w-l,.w-accent .cur{color:rgba(255,255,255,.82)}
.w-l{font-size:12.5px; color:var(--card-muted); font-weight:500}
.glass .w-l{color:var(--muted)}
.w-big{font:800 36px/1.1 var(--font-latin); letter-spacing:-.03em; margin:2px 0 8px}
.w-big .cur{font-size:15px; margin-inline-start:6px; color:var(--card-muted)}
.w-accent .w-big .cur{color:rgba(255,255,255,.8)}
.w-go{position:absolute; inset-inline-end:14px; bottom:14px; display:flex; align-items:center; gap:4px; font-size:13px; font-weight:700; background:rgba(255,255,255,.18); padding:6px 10px; border-radius:999px}
.bar{height:6px; width:100%; border-radius:3px; background:var(--card-track); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:3px}
.w-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; margin-top:12px}
.w-stats div{font-size:11.5px; color:var(--card-muted)} .w-stats b{display:block; color:var(--on-card); font-size:14px; margin-top:2px}
.w-ic{width:34px; height:34px; border-radius:50%; background:var(--surface); display:grid; place-items:center; margin-bottom:6px}
.w-num{font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1}
.w-t{font-size:13px; font-weight:700; margin-top:6px}
.w-s{font-size:12px; color:var(--muted)}
.w .ring{margin-bottom:6px}
.tone-warn .w-ic{background:var(--warn-soft); color:var(--warn-text)} .tone-accent .w-ic{background:var(--accent-soft); color:var(--accent)}
.ov{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; width:100%; margin-top:8px}
.ov span{font-size:12px; color:var(--muted)} .ov b{display:block; font-size:17px; margin-top:2px}
.cbars{display:flex; flex-direction:column; gap:7px; width:100%; margin-top:12px}
.cb{display:grid; grid-template-columns:88px 1fr auto; gap:8px; align-items:center; font-size:12px}
.cb-l{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cb-b{height:8px; border-radius:4px; background:var(--track); overflow:hidden} .cb-b i{display:block; height:100%; background:var(--primary); border-radius:4px}
.bubbles{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(66px,1fr); gap:6px 4px; margin:16px 0 0; padding:0 12px; overflow-x:auto; scrollbar-width:none} .bubbles::-webkit-scrollbar{display:none}
.bubble{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.b-ic{width:56px; height:56px; border-radius:50%; background:var(--glass); border:1px solid var(--glass-line); box-shadow:var(--glass-shadow); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); display:grid; place-items:center; position:relative; transition:transform .15s}
.bubble:active .b-ic{transform:scale(.94)}
.bubble:first-child .b-ic{background:var(--primary); color:var(--on-primary); border-color:transparent}
.b-l{font-size:11px; font-weight:600; text-align:center; line-height:1.25; max-width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.badge{position:absolute; top:-2px; inset-inline-end:-2px; min-width:19px; height:19px; padding-inline:5px; border-radius:10px; background:var(--accent); color:#fff; font:700 11px/19px var(--font-latin); text-align:center; border:2px solid var(--bg2)}

/* lists */
.list{margin:0 16px; border-radius:var(--r-lg); overflow:hidden}
.row{display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; text-align:start; min-width:0}
.row + .row{border-top:1px solid var(--line)}
.row.inline{padding:6px 0}
.ico{width:40px; height:40px; border-radius:50%; background:var(--surface); display:grid; place-items:center; flex:none}
.ico.big{width:52px; height:52px}
.grow{flex:1; min-width:0}
.end{text-align:end; flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.amt{font-weight:700; font-size:14.5px; white-space:nowrap}
.cur{font-size:.74em; font-weight:600; color:var(--muted)}
.seqno{width:30px; height:30px; border-radius:9px; background:var(--surface); display:grid; place-items:center; font-weight:800; font-size:12px; flex:none}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap}
.p-review,.p-po-partial,.p-po-pending,.p-f-in_review{background:var(--warn-soft); color:var(--warn-text)}
.p-approved,.p-po-matched,.p-po-received,.p-f-approved{background:var(--pos-soft); color:var(--pos-text)}
.p-returned,.p-pr-new,.p-po-ordered,.p-f-open{background:var(--accent-soft); color:var(--accent)}
.p-rejected,.p-po-mismatch{background:var(--neg-soft); color:var(--neg)}
.p-withdrawn,.p-pr-ordered,.p-f-closed{background:var(--surface); color:var(--muted)}
.search{margin:0 16px 10px; height:44px; border-radius:999px; display:flex; align-items:center; gap:8px; padding-inline:14px}
.search input{border:0; background:transparent; flex:1; min-width:0; font-size:15px}
.search input:focus{outline:none}
.hscroll{overflow-x:auto; scrollbar-width:none; padding-inline:16px; margin-bottom:10px}
.hscroll::-webkit-scrollbar{display:none}
.seg{display:inline-flex; gap:4px; padding:4px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line); margin:0 16px 10px; max-width:calc(100% - 32px); overflow-x:auto; scrollbar-width:none}
.hscroll .seg{margin:0; max-width:none}
.seg button{padding:8px 13px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--primary); color:var(--on-primary)}
.segn{font-family:var(--font-latin); opacity:.8}
.mini-seg{display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:var(--surface)}
.mini-seg.full{display:grid; grid-template-columns:1fr 1fr}
.mini-seg button{padding:6px 10px; border-radius:999px; font-size:12px; font-weight:600; color:var(--muted)}
.mini-seg button[aria-pressed="true"]{background:var(--bg); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* invoice */
.inv-hero{display:flex; gap:14px; align-items:center; margin:2px 16px 0}
.thumb-wrap{width:84px; height:110px; border-radius:14px; overflow:hidden; flex:none; background:var(--paper); box-shadow:var(--glass-shadow); object-fit:cover}
.thumb-wrap img{width:100%; height:100%; object-fit:cover}
.mini-rc{height:100%; padding:9px 8px; display:flex; flex-direction:column; gap:4px; color:var(--ink); font-size:8px; font-family:var(--font-latin); position:relative}
.mini-rc b{font-size:8.5px; white-space:nowrap; overflow:hidden}
.mini-rc i{display:block; height:3px; border-radius:2px; background:#D5D5D5}
.mini-rc span.num{margin-top:auto; font-weight:800; font-size:10px}
.mqr{position:absolute; bottom:7px; inset-inline-end:6px; color:#222}
.hero-amt{font:800 30px var(--font-latin); letter-spacing:-.02em; margin:2px 0 6px}
.folder-link{margin:12px 16px 0; border-radius:999px; height:46px; display:flex; align-items:center; gap:10px; padding-inline:16px; font-size:14px; width:calc(100% - 32px)}
.folder-link b{margin-inline-start:auto}
.banner{margin:10px 16px 0; padding:10px 12px; border-radius:14px; font-size:13px; font-weight:600; display:flex; gap:8px; align-items:flex-start; line-height:1.45}
.banner svg{flex:none; margin-top:1px}
.b-ok{background:var(--pos-soft); color:var(--pos-text)} .b-warn{background:var(--warn-soft); color:var(--warn-text)}
.b-info{background:var(--accent-soft); color:var(--accent)} .b-bad{background:var(--neg-soft); color:var(--neg)}
.kv{margin:12px 16px 0; border-radius:var(--r-md); overflow:hidden}
.kv .r{display:flex; justify-content:space-between; gap:12px; padding:11px 14px; font-size:14px}
.kv .r + .r{border-top:1px solid var(--line)}
.kv .k{color:var(--muted); min-width:0}
.kv .v{font-weight:600; text-align:end; min-width:0; overflow-wrap:anywhere}
.kv .tot .k,.kv .tot .v{color:var(--fg); font-weight:800; font-size:16px}
.items{border-radius:var(--r-sm); background:var(--bg); border:1px solid var(--line); padding:4px 12px}
.items.low{background:var(--warn-soft); border-color:var(--warn)}
.items .r{display:flex; justify-content:space-between; gap:8px; padding:7px 0; font-size:13px}
.items .r + .r{border-top:1px solid var(--line)}
.timeline{margin:0 16px; border-radius:var(--r-lg); padding:14px}
.tl{display:flex; gap:12px; position:relative; padding-bottom:14px}
.tl:last-child{padding-bottom:0}
.tl .dot{width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--track); color:var(--subtle); position:relative; z-index:1}
.tl.done .dot{background:var(--primary); color:var(--on-primary)}
.tl.done.bad .dot{background:var(--neg); color:#fff}
.tl.done.cr .dot{background:var(--accent); color:#fff}
.tl.cur .dot{background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.tl:not(:last-child)::before{content:""; position:absolute; top:22px; bottom:0; inset-inline-start:10px; width:2px; background:var(--line)}
.tl .t1{white-space:normal; font-size:14px}
.note{margin-top:6px; font-size:13px; background:var(--surface); padding:8px 10px; border-radius:10px; line-height:1.45}
.footer{position:sticky; bottom:0; padding:12px 16px 18px; background:linear-gradient(to top, var(--bg2) 70%, transparent); margin-top:auto; z-index:5}
.acts{display:flex; flex-direction:column; gap:8px}
.acts.three{display:grid; grid-template-columns:1fr 1fr 1.4fr}
.acts.two{display:grid; grid-template-columns:1fr 1fr}

/* approvals */
.apcard{margin:0 16px 10px; border-radius:var(--r-lg); padding:14px; display:flex; flex-direction:column; gap:10px; width:calc(100% - 32px); text-align:start}
.ap-top{display:flex; gap:10px; align-items:center}
.ap-amt{font:800 20px var(--font-latin); letter-spacing:-.02em}
.ap-bot{display:flex; justify-content:space-between; align-items:center; gap:8px}
.stepbar{display:flex; gap:4px}
.stepbar i{flex:1; height:5px; border-radius:3px; background:var(--track)}
.stepbar i.on{background:var(--primary)} .stepbar i.cur{background:var(--accent)}
.flag{font-size:12px; font-weight:600; display:flex; gap:4px; align-items:center; white-space:nowrap}
.flag.ok{color:var(--pos-text)} .flag.warn{color:var(--warn-text)}
.match3{display:flex; gap:4px}
.m3{font-size:11px; font-weight:700; padding:3px 7px; border-radius:7px; background:var(--surface); color:var(--subtle)}
.m3.ok{background:var(--pos-soft); color:var(--pos-text)} .m3.part{background:var(--warn-soft); color:var(--warn-text)} .m3.bad{background:var(--neg-soft); color:var(--neg)}
.empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:24px; text-align:center}
.empty .fig,.fig.wide{width:230px; max-width:100%; --hairline-plate:var(--bg2); align-self:center}

/* folders */
.fcard{margin:0 16px 10px; border-radius:var(--r-lg); padding:12px 14px; display:flex; align-items:center; gap:12px; width:calc(100% - 32px); text-align:start}
.fold{margin:4px 16px 0; border-radius:var(--r-lg); background:var(--card); color:var(--on-card); padding:16px}
.fold-h{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.fold-no{font-size:12.5px; color:var(--card-muted); font-weight:600}
.fold-c{font:800 44px/1 var(--font-latin); letter-spacing:-.03em; margin-top:6px}
.fold-c small{font-size:18px; color:var(--card-muted)}
.slots{display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin:14px 0 8px; direction:ltr}
.slots i,.legend i{aspect-ratio:3/4; border-radius:4px; background:var(--card-track); display:block}
.slots i.s-approved,.legend i.s-approved{background:var(--on-card)}
.slots i.s-review,.legend i.s-review{background:var(--warn)}
.slots i.s-returned,.legend i.s-returned{background:var(--accent)}
.slots i.s-rejected,.legend i.s-rejected{background:var(--neg)}
.slots i.s-withdrawn,.legend i.s-withdrawn{background:repeating-linear-gradient(45deg,#666 0 2px,transparent 2px 5px); outline:1px solid #666}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--card-muted)}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:9px; aspect-ratio:3/4}
.fold-note{font-size:12px; color:var(--card-muted); line-height:1.5; margin-top:10px}
.totals{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 16px 0}
.totals > div{border-radius:var(--r-md); padding:12px}
.totals span{font-size:12px; color:var(--muted)}
.totals b{display:block; font-size:17px; margin-top:4px}
.sigs{display:flex; flex-direction:column; gap:8px; margin:0 16px 12px}
.sig{display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:11px 14px; border-radius:var(--r-sm); align-items:center; flex-wrap:wrap}

/* supplies */
.quote{margin:0 16px 8px; border-radius:var(--r-md); padding:12px 14px; display:flex; gap:10px; align-items:center}
.quote.best{outline:2px solid var(--pos)}
.tablewrap{margin:0 16px; border-radius:var(--r-md); overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th{font-size:11.5px; color:var(--muted); font-weight:600; text-align:start; padding:10px 10px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl.matrix th,.tbl.matrix td{text-align:center; padding:7px 4px}
.tbl.matrix th:first-child,.tbl.matrix td:first-child{text-align:start; padding-inline:10px; white-space:nowrap; position:sticky; inset-inline-start:0; background:var(--bg)}
.tbl.matrix tr.sep td{border-top:2px solid var(--line)}
.vert{writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; font-size:11px; display:inline-block}

/* me / team */
.profile{display:flex; gap:14px; align-items:center}
.org{padding-inline-start:calc(var(--d) * 14px); margin:0 16px}
.org-n{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:var(--r-md); margin-bottom:8px; text-align:start}
.org-k{border-inline-start:2px solid var(--line); margin-inline-start:18px}
.org-k .org{margin:0}
.person-head{text-align:center; padding:4px 16px 14px}
.chip{display:inline-block}
.radio{width:22px; height:22px; border-radius:50%; border:2px solid var(--track); flex:none}
.radio.on{border:7px solid var(--primary)}
.switch{width:50px; height:30px; border-radius:15px; background:var(--track); position:relative; flex:none}
.switch::after{content:""; position:absolute; top:3px; inset-inline-start:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:inset-inline-start .2s}
.switch.on{background:var(--pos)} .switch.on::after{inset-inline-start:23px}

/* dock */
.dock{position:absolute; left:12px; right:12px; bottom:14px; z-index:10; display:grid; grid-template-columns:repeat(5,1fr); padding:6px; border-radius:30px;
  background:var(--glass); border:1px solid var(--glass-line); box-shadow:0 10px 34px rgba(0,0,0,.16); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%)}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; font-weight:600; color:var(--subtle); padding:7px 2px; border-radius:24px; position:relative; min-width:0}
.tab span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tab[aria-current="page"]{background:var(--primary); color:var(--on-primary)}
.tab .badge{top:2px; inset-inline-end:calc(50% - 22px); border-color:var(--glass)}

/* camera */
.camera{flex:1; display:flex; flex-direction:column; color:#fff; min-height:100%}
.cam-top{display:flex; justify-content:space-between; align-items:center; padding:6px 16px}
.cam-t{font-weight:700}
.round{width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.12); display:grid; place-items:center; color:#fff}
.viewfinder{flex:1; position:relative; display:grid; place-items:center; padding:20px 40px; min-height:380px}
.corners{position:absolute; inset:18px 30px; pointer-events:none}
.corners i{position:absolute; width:28px; height:28px; border:3px solid #fff}
.corners i:nth-child(1){top:0; left:0; border-right:0; border-bottom:0; border-radius:10px 0 0 0}
.corners i:nth-child(2){top:0; right:0; border-left:0; border-bottom:0; border-radius:0 10px 0 0}
.corners i:nth-child(3){bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 10px}
.corners i:nth-child(4){bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 10px 0}
.receipt{width:206px; background:var(--paper); color:var(--ink); border-radius:4px; padding:14px 14px 18px; font:10.5px/1.45 var(--font-latin); transform:rotate(-2deg); box-shadow:0 12px 40px rgba(0,0,0,.5); direction:ltr; text-align:left}
.receipt.hand{font-family:"Courier New",monospace; transform:rotate(1.5deg); background:#FBF7EC}
.rt{font-weight:800; font-size:12px; text-align:center} .rs{text-align:center; color:#555; margin-bottom:6px}
.rl{display:flex; justify-content:space-between; gap:6px} .receipt hr{border:0; border-top:1px dashed #999; margin:6px 0}
.qr{width:70px; height:70px; margin:8px auto 0; display:block}
.camhint{text-align:center; font-size:14px; color:#DDD; padding:0 24px 8px}
.camseg{display:flex; justify-content:center; gap:6px; padding:4px 16px}
.camseg button{padding:8px 12px; border-radius:999px; font-size:13px; font-weight:600; background:rgba(255,255,255,.1); color:#fff}
.camseg button[aria-pressed="true"]{background:#fff; color:#000}
.shutter-row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:16px 20px 28px; gap:10px}
.shutter{width:76px; height:76px; border-radius:50%; border:4px solid #fff; display:grid; place-items:center}
.shutter i{width:60px; height:60px; border-radius:50%; background:#fff; display:block}
.cam-side{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11.5px; font-weight:600; color:#fff; justify-self:center}
.cam-side svg{width:46px; height:46px; padding:11px; border-radius:50%; background:rgba(255,255,255,.12)}
.steps{display:flex; flex-direction:column; gap:9px; font-size:14px; color:var(--muted); text-align:start}
.steps div{display:flex; align-items:center; gap:8px; opacity:.35; transition:opacity .2s}
.steps .done{opacity:1; color:var(--fg)} .steps .skip{opacity:.7}

/* sheet & toast */
.scrim{position:absolute; inset:0; background:rgba(0,0,0,.42); z-index:30; display:flex; align-items:flex-end}
.sheet{background:var(--bg); width:100%; max-height:88%; overflow-y:auto; border-radius:28px 28px 0 0; padding:10px 18px 24px; display:flex; flex-direction:column; gap:12px; animation:up .22s ease-out}
.sheet .list,.sheet .banner{margin:0}
.grab{width:40px; height:5px; border-radius:3px; background:var(--track); margin:0 auto 4px}
@keyframes up{from{transform:translateY(40px); opacity:.6}}
.amount-in{font:800 40px var(--font-latin); text-align:center; border:0; background:none; color:var(--fg); width:100%; padding:8px 0; direction:ltr}
.amount-in:focus{outline:none}
.toast{position:absolute; inset-inline:16px; bottom:96px; z-index:40; background:var(--primary); color:var(--on-primary); padding:13px 16px; border-radius:16px; font-size:14px; font-weight:600; display:flex; gap:10px; align-items:center; animation:up .2s ease-out; box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--neg); color:#fff}


/* ---------- v0.4: home redesign & new components ---------- */
.hero{margin:12px 16px 0; border-radius:28px; padding:18px; color:#fff; text-align:start; display:flex; flex-direction:column; gap:2px; position:relative; overflow:hidden; width:calc(100% - 32px);
  background:radial-gradient(120% 90% at 100% 0%, rgba(39,110,241,.55), transparent 55%), radial-gradient(90% 80% at 0% 100%, rgba(39,110,241,.22), transparent 60%), #0B0B0D;
  box-shadow:0 18px 40px rgba(10,20,50,.28)}
.hero + .hero{margin-top:10px}
.hero.static{cursor:default}
.hero-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px}
.hero-l{font-size:12.5px; color:rgba(255,255,255,.66); font-weight:500}
.hero-chip{font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.12); color:#fff; max-width:60%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-flex; gap:5px; align-items:center}
.hero-chip.btnish{cursor:pointer}
.hero-big{font:800 38px/1.05 var(--font-latin); letter-spacing:-.03em; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.hero-big .cur{font-size:13.5px; color:rgba(255,255,255,.66); font-weight:600; letter-spacing:0; font-family:var(--font)}
.hero .spark{width:100%; height:56px; margin-top:10px; display:block}
.hero-cap{font-size:11.5px; color:rgba(255,255,255,.55)}
.hero-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1)}
.hero-stats span{font-size:11px; color:rgba(255,255,255,.6); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hero-stats b{font-size:15px; color:#fff}
.hero-list{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.hl-row{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.07); border-radius:14px; padding:8px 10px; color:#fff; font-size:13px; text-align:start}
.hl-row .grow{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,.8)}
.hl-row b{color:#fff}
.hero-cta{margin-top:12px; align-self:flex-start; display:flex; align-items:center; gap:4px; background:#276EF1; color:#fff; font-weight:700; font-size:13.5px; padding:9px 14px; border-radius:999px}
.hero .avatar{background:rgba(255,255,255,.14); color:#fff}
.hcards{display:flex; gap:10px; overflow-x:auto; padding:2px 16px 6px; scrollbar-width:none; scroll-snap-type:x mandatory}
.hcards::-webkit-scrollbar{display:none}
.hcard{flex:0 0 150px; scroll-snap-align:start; border-radius:20px; padding:12px; display:flex; flex-direction:column; gap:6px; text-align:start; min-height:112px}
.hc-ic{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent)}
.tone-warn .hc-ic{background:var(--warn-soft); color:var(--warn-text)} .tone-bad .hc-ic{background:var(--neg-soft); color:var(--neg)}
.hc-t{font-weight:700; font-size:13.5px; line-height:1.3}
.hc-s{font-size:12px; color:var(--muted); margin-top:auto}
.allclear{margin:14px 16px 0; border-radius:16px; padding:12px 14px; display:flex; gap:8px; align-items:center; font-size:13.5px; font-weight:600; color:var(--pos-text)}
.wpad{margin:12px 16px 0}
.w.budget{flex-direction:row; align-items:center; gap:14px; min-height:0; width:100%}
.w.budget .pill{margin-top:6px}
.wide-card{padding:16px}
.cbars{display:flex; flex-direction:column; gap:9px}
.card.cbars{width:auto}
.cb{display:grid; grid-template-columns:minmax(0,118px) 1fr auto; gap:10px; align-items:center; font-size:12.5px}
.cb-l{display:flex; gap:6px; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted)}
.cb-b{height:9px; border-radius:5px; background:var(--track); overflow:hidden}
.cb-b i{display:block; height:100%; border-radius:5px; background:linear-gradient(90deg, var(--accent), #5B91F5)}
.nbadge{position:absolute; top:-3px; inset-inline-end:-3px; min-width:19px; height:19px; padding-inline:5px; border-radius:10px; background:var(--neg); color:#fff; font:700 10.5px/19px var(--font-latin); text-align:center; border:2px solid var(--bg2)}
.row-links{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap}
.row-links .link{font-size:13px}
.center-ic{display:grid; place-items:center; margin:8px 0 4px; color:var(--accent)}
.rules{margin:0; padding-inline-start:18px; font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:3px}
.temppw{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; border-radius:14px; background:var(--surface); border:1.5px dashed var(--accent)}
.temppw .num{font-size:22px; font-weight:800; letter-spacing:.04em; user-select:all; direction:ltr}
.picked{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px}
.picklist{margin:0}
.filters{display:flex; gap:8px; margin:0 16px 8px; flex-wrap:wrap}
.fsel{display:inline-flex; align-items:center; gap:6px; height:36px; padding-inline:12px; border-radius:999px; background:var(--glass); border:1px solid var(--glass-line); font-size:13px; font-weight:600; min-width:0; max-width:100%}
.fsel select{appearance:none; -webkit-appearance:none; border:0; background:transparent; font-weight:600; font-size:13px; min-width:0; max-width:150px; cursor:pointer}
.more{margin:10px 16px 0; width:calc(100% - 32px)}
.minibar{height:4px; border-radius:2px; background:var(--track); overflow:hidden; margin-top:6px}
.minibar i{display:block; height:100%; background:var(--accent)}
.pcard{margin:0 16px 10px; border-radius:var(--r-lg); padding:14px; display:flex; flex-direction:column; gap:10px; width:calc(100% - 32px); text-align:start}
.bbar{height:6px; border-radius:3px; background:var(--track); overflow:hidden}
.bbar i{display:block; height:100%; background:var(--accent); border-radius:3px}
.bbar.near i{background:var(--warn)} .bbar.over i{background:var(--neg)}
.org{margin:0 16px}
.org .org{margin:0}
.org-n{display:flex; align-items:center; gap:4px; width:100%; padding:6px 8px; border-radius:var(--r-md); margin-bottom:8px}
.org-tg{width:28px; height:28px; display:grid; place-items:center; border-radius:50%; flex:none; color:var(--muted)}
